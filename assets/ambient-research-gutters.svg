<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
<defs>
  <style>
    .line{stroke:#82c9ef;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.64}
    .fine{stroke:#82c9ef;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;opacity:.42}
    .soft{fill:#82c9ef;fill-opacity:.09;stroke:#82c9ef;stroke-width:1.5;stroke-linejoin:round;opacity:.62}
    .route{stroke:#82c9ef;stroke-width:1.1;stroke-dasharray:2 9;stroke-linecap:round;opacity:.26}
    .glow{filter:url(#glow)}
    .drift-a{animation:driftA 24s ease-in-out infinite}
    .drift-b{animation:driftB 30s ease-in-out infinite}
    .drift-c{animation:driftC 36s ease-in-out infinite}
    .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 48s linear infinite}
    .twinkle{animation:twinkle 5s ease-in-out infinite alternate}
    @keyframes driftA{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(9px,-13px) rotate(2deg)}}
    @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,11px)}}
    @keyframes driftC{0%,100%{transform:translate(0,0) rotate(2deg)}50%{transform:translate(7px,8px) rotate(-2deg)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes twinkle{from{opacity:.18}to{opacity:.65}}
    @media(prefers-reduced-motion:reduce){.drift-a,.drift-b,.drift-c,.orbit,.twinkle{animation:none!important}}
  </style>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
