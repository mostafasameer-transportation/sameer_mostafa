<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1130" role="img" aria-labelledby="title desc">
<title id="title">Mobile graphical abstract: Machine Learning for Autonomous Vehicles</title>
<desc id="desc">Mobile-first view of the scientometric review, its research window, five themes, key challenges, and future directions.</desc>
<style>
text{font-family:Inter,Arial,sans-serif}.muted{fill:#c8d7e7}.subtle{fill:#9db3c9}.white{fill:#fff}.kicker{fill:#8bc8ff;font-size:12px;font-weight:700;letter-spacing:1.5px}.heading{font-size:23px;font-weight:800}.body{font-size:14px}.small{font-size:12.5px}.cardTitle{font-size:17px;font-weight:700}.track{stroke-dasharray:7 8;animation:dash 9s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.5s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-140}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.1)}}@media(prefers-reduced-motion:reduce){.track,.pulse{animation:none!important}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2440"/><stop offset="1" stop-color="#111923"/></linearGradient><linearGradient id="signal"><stop stop-color="#47a5f5"/><stop offset="1" stop-color="#58dfc0"/></linearGradient></defs>
<rect width="480" height="1130" rx="18" fill="url(#bg)"/>
<text x="24" y="33" class="kicker">RESEARCH VISUAL SUMMARY · 2025</text>
<text x="24" y="68" class="white" font-size="25" font-weight="800">Machine Learning for</text>
<text x="24" y="98" class="white" font-size="25" font-weight="800">Autonomous Vehicles</text>
<text x="24" y="124" class="muted body">Scientometric review of trends, applications,</text>
<text x="24" y="144" class="muted body">challenges and future directions</text>
<path d="M24 163H456" stroke="#344658"/>
<rect x="24" y="180" width="432" height="94" rx="12" fill="#132b43" stroke="#315d82"/>
<text x="42" y="204" fill="#8bc8ff" font-size="12" font-weight="700" letter-spacing="1">RESEARCH WINDOW</text>
<text x="42" y="238" class="white" font-size="26" font-weight="800">2011–2025</text>
<text x="42" y="258" class="muted small">Bibliometrics, science mapping and qualitative synthesis</text>
<text x="24" y="307" class="white" font-size="13" font-weight="700" letter-spacing="1">FIVE THEMATIC AREAS</text>
<path d="M28 327H451" stroke="url(#signal)" stroke-width="2.5" class="track"/>
<g><rect x="24" y="344" width="432" height="87" rx="12" fill="#142b46" stroke="#4d8ee6"/><rect x="24" y="344" width="6" height="87" rx="3" fill="#4d8ee6"/><circle cx="50" cy="367" r="7" fill="#4d8ee6" class="pulse"/><text x="68" y="373" class="white cardTitle">01 · Perception</text><text x="42" y="397" class="muted body">Object detection and scene understanding</text><text x="42" y="416" class="subtle small">Turning sensor data into a usable scene model</text></g>
<g><rect x="24" y="444" width="432" height="87" rx="12" fill="#302719" stroke="#d99a3d"/><rect x="24" y="444" width="6" height="87" rx="3" fill="#d99a3d"/><circle cx="50" cy="467" r="7" fill="#d99a3d" class="pulse" style="animation-delay:.25s"/><text x="68" y="473" class="white cardTitle">02 · Planning</text><text x="42" y="497" fill="#e8dcc8" class="body">Decision-making and trajectory optimization</text><text x="42" y="516" fill="#c8b99f" class="small">Choosing a safe and feasible path</text></g>
<g><rect x="24" y="544" width="432" height="87" rx="12" fill="#153228" stroke="#41b67c"/><rect x="24" y="544" width="6" height="87" rx="3" fill="#41b67c"/><circle cx="50" cy="567" r="7" fill="#41b67c" class="pulse" style="animation-delay:.5s"/><text x="68" y="573" class="white cardTitle">03 · Control</text><text x="42" y="597" fill="#d2e7db" class="body">Vehicle response and trajectory tracking</text><text x="42" y="616" fill="#a8c9b8" class="small">Translating plans into vehicle actions</text></g>
<g><rect x="24" y="644" width="432" height="87" rx="12" fill="#352025" stroke="#e7656b"/><rect x="24" y="644" width="6" height="87" rx="3" fill="#e7656b"/><circle cx="50" cy="667" r="7" fill="#e7656b" class="pulse" style="animation-delay:.75s"/><text x="68" y="673" class="white cardTitle">04 · Safety and robustness</text><text x="42" y="697" fill="#f0d8da" class="body">Validation, reliability and interpretability</text><text x="42" y="716" fill="#d8b5b9" class="small">Handling uncertainty and changing conditions</text></g>
<g><rect x="24" y="744" width="432" height="87" rx="12" fill="#22213b" stroke="#9a86ed"/><rect x="24" y="744" width="6" height="87" rx="3" fill="#9a86ed"/><circle cx="50" cy="767" r="7" fill="#9a86ed" class="pulse" style="animation-delay:1s"/><text x="68" y="773" class="white cardTitle">05 · Connected systems</text><text x="42" y="797" fill="#dcd7f6" class="body">Communication and federated learning</text><text x="42" y="816" fill="#b8b0df" class="small">Learning across connected vehicles and systems</text></g>
<rect x="24" y="849" width="432" height="104" rx="12" fill="#2b2026" stroke="#7a454b"/>
<text x="42" y="874" fill="#ffb2a8" font-size="12" font-weight="700" letter-spacing="1">PERSISTENT CHALLENGES</text>
<text x="42" y="900" class="white body">Generalization · Safety validation</text><text x="42" y="922" class="white body">Interpretability · Reliable deployment</text><text x="42" y="941" fill="#d8b5b9" class="small">Performance must hold beyond training conditions.</text>
<rect x="24" y="971" width="432" height="104" rx="12" fill="#122c29" stroke="#317c69"/>
<text x="42" y="996" fill="#7fe0c7" font-size="12" font-weight="700" letter-spacing="1">EMERGING DIRECTIONS</text>
<text x="42" y="1022" class="white body">Digital twins · Edge AI · Quantum ML</text><text x="42" y="1044" class="white body">Large language models</text><text x="42" y="1062" fill="#9fcbbd" class="small">Toward adaptable, trustworthy autonomy</text>
<text x="24" y="1103" class="subtle small">Research mapping shows field structure, not proof of vehicle safety.</text>
</svg>