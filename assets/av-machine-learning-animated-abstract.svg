<svg viewBox="0 0 960 570" role="img" aria-labelledby="avAbstractTitle avAbstractDesc" xmlns="http://www.w3.org/2000/svg">
            <title id="avAbstractTitle">Mapping the Machine Learning Landscape in Autonomous Vehicles</title>
            <desc id="avAbstractDesc">Animated summary of a scientometric review covering research from 2011 to 2025, five major machine learning themes, key challenges, and emerging directions.</desc>
            <style>
              .av-flow{stroke-dasharray:7 9;animation:avDash 12s linear infinite}
              .av-pulse{transform-box:fill-box;transform-origin:center;animation:avPulse 2.6s ease-in-out infinite}
              .av-fade{animation:avFade 4.8s ease-in-out infinite}
              @keyframes avDash{to{stroke-dashoffset:-160}}
              @keyframes avPulse{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.08)}}
              @keyframes avFade{0%,100%{opacity:.65}50%{opacity:1}}
              @media(prefers-reduced-motion:reduce){.av-flow,.av-pulse,.av-fade{animation:none!important}.av-traveler{display:none}}
            </style>
            <defs>
              <linearGradient id="avBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2440"/><stop offset="1" stop-color="#111923"/></linearGradient>
              <linearGradient id="avSignal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#47a5f5"/><stop offset="1" stop-color="#58dfc0"/></linearGradient>
            </defs>
            <rect width="960" height="570" rx="18" fill="url(#avBg)"/>
            <text x="34" y="37" fill="#8bc8ff" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="2">ANIMATED RESEARCH VISUAL SUMMARY · 2025</text>
            <text x="34" y="72" fill="#fff" font-size="27" font-family="Inter,Arial,sans-serif" font-weight="800">Machine Learning for Autonomous Vehicles</text>
            <text x="34" y="98" fill="#c9d7e6" font-size="14" font-family="Inter,Arial,sans-serif">Scientometric mapping of research trends, applications, challenges and future directions</text>
            <rect x="34" y="116" width="892" height="1.5" fill="#344658"/>

            <g>
              <rect x="34" y="132" width="278" height="76" rx="11" fill="#132b43" stroke="#315d82"/>
              <text x="50" y="153" fill="#8bc8ff" font-size="10.5" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="1">RESEARCH WINDOW</text>
              <text x="50" y="180" fill="#fff" font-size="23" font-family="Inter,Arial,sans-serif" font-weight="800">2011–2025</text>
              <text x="202" y="180" fill="#a9bfd5" font-size="11" font-family="Inter,Arial,sans-serif">long-term evolution</text>
              <rect x="326" y="132" width="300" height="76" rx="11" fill="#132b43" stroke="#315d82"/>
              <text x="342" y="153" fill="#79dfc7" font-size="10.5" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="1">ANALYTICAL APPROACH</text>
              <text x="342" y="177" fill="#fff" font-size="15" font-family="Inter,Arial,sans-serif" font-weight="700">Bibliometrics + science mapping</text>
              <text x="342" y="194" fill="#a9bfd5" font-size="11" font-family="Inter,Arial,sans-serif">Publication, keyword and collaboration structures</text>
              <rect x="640" y="132" width="286" height="76" rx="11" fill="#132b43" stroke="#315d82"/>
              <text x="656" y="153" fill="#ffc36c" font-size="10.5" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="1">QUALITATIVE SYNTHESIS</text>
              <text x="656" y="180" fill="#fff" font-size="23" font-family="Inter,Arial,sans-serif" font-weight="800">50</text>
              <text x="701" y="178" fill="#d4e0ed" font-size="13" font-family="Inter,Arial,sans-serif">most-cited papers</text>
              <text x="656" y="195" fill="#a9bfd5" font-size="11" font-family="Inter,Arial,sans-serif">Methods, contributions and open challenges</text>
            </g>

            <text x="34" y="235" fill="#d9e7f5" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="1.4">FIVE DOMINANT THEMATIC CLUSTERS</text>
            <path d="M70 249 H890" stroke="#31516d" stroke-width="2" fill="none"/>
            <path d="M70 249 H890" stroke="url(#avSignal)" stroke-width="2.5" fill="none" class="av-flow"/>
            <circle class="av-traveler" r="5" fill="#fff"><animateMotion dur="7s" repeatCount="indefinite" path="M70 249 H890"/></circle>

            <g>
              <rect x="34" y="261" width="166" height="116" rx="11" fill="#142b46" stroke="#4d8ee6"/>
              <rect x="34" y="261" width="5" height="116" rx="2.5" fill="#4d8ee6"/>
              <circle cx="61" cy="286" r="9" fill="#4d8ee6" class="av-pulse"/>
              <circle cx="61" cy="286" r="17" stroke="#4d8ee6" stroke-opacity=".36" fill="none"/>
