              <text x="53" y="339" fill="#c9d9e9" font-size="11.5" font-family="Inter,Arial,sans-serif">Object detection,</text><text x="53" y="355" fill="#c9d9e9" font-size="11.5" font-family="Inter,Arial,sans-serif">scene understanding</text>
            </g>
            <g>
              <rect x="217" y="261" width="166" height="116" rx="11" fill="#302719" stroke="#d99a3d"/>
              <rect x="217" y="261" width="5" height="116" rx="2.5" fill="#d99a3d"/>
              <circle cx="244" cy="286" r="9" fill="#d99a3d" class="av-pulse" style="animation-delay:.3s"/>
              <circle cx="244" cy="286" r="17" stroke="#d99a3d" stroke-opacity=".36" fill="none"/>
              <text x="236" y="317" fill="#fff" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="700">Planning</text>
              <text x="236" y="339" fill="#e8dcc8" font-size="11.5" font-family="Inter,Arial,sans-serif">Decision-making and</text><text x="236" y="355" fill="#e8dcc8" font-size="11.5" font-family="Inter,Arial,sans-serif">trajectory optimization</text>
            </g>
            <g>
              <rect x="400" y="261" width="166" height="116" rx="11" fill="#153228" stroke="#41b67c"/>
              <rect x="400" y="261" width="5" height="116" rx="2.5" fill="#41b67c"/>
              <circle cx="427" cy="286" r="9" fill="#41b67c" class="av-pulse" style="animation-delay:.6s"/>
              <circle cx="427" cy="286" r="17" stroke="#41b67c" stroke-opacity=".36" fill="none"/>
              <text x="419" y="317" fill="#fff" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="700">Control</text>
              <text x="419" y="339" fill="#d2e7db" font-size="11.5" font-family="Inter,Arial,sans-serif">Vehicle response and</text><text x="419" y="355" fill="#d2e7db" font-size="11.5" font-family="Inter,Arial,sans-serif">trajectory tracking</text>
            </g>
            <g>
              <rect x="583" y="261" width="166" height="116" rx="11" fill="#352025" stroke="#e7656b"/>
              <rect x="583" y="261" width="5" height="116" rx="2.5" fill="#e7656b"/>
              <circle cx="610" cy="286" r="9" fill="#e7656b" class="av-pulse" style="animation-delay:.9s"/>
              <circle cx="610" cy="286" r="17" stroke="#e7656b" stroke-opacity=".36" fill="none"/>
              <text x="602" y="317" fill="#fff" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="700">Safety &amp; robustness</text>
              <text x="602" y="339" fill="#f0d8da" font-size="11.5" font-family="Inter,Arial,sans-serif">Validation, reliability</text><text x="602" y="355" fill="#f0d8da" font-size="11.5" font-family="Inter,Arial,sans-serif">and interpretation</text>
            </g>
            <g>
              <rect x="766" y="261" width="160" height="116" rx="11" fill="#22213b" stroke="#9a86ed"/>
              <rect x="766" y="261" width="5" height="116" rx="2.5" fill="#9a86ed"/>
              <circle cx="793" cy="286" r="9" fill="#9a86ed" class="av-pulse" style="animation-delay:1.2s"/>
              <circle cx="793" cy="286" r="17" stroke="#9a86ed" stroke-opacity=".36" fill="none"/>
              <text x="785" y="317" fill="#fff" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="700">Connected systems</text>
              <text x="785" y="339" fill="#dcd7f6" font-size="11.5" font-family="Inter,Arial,sans-serif">Communication and</text><text x="785" y="355" fill="#dcd7f6" font-size="11.5" font-family="Inter,Arial,sans-serif">federated learning</text>
            </g>

            <rect x="34" y="397" width="432" height="102" rx="12" fill="#121f2e" stroke="#344658"/>
            <text x="52" y="420" fill="#ffb2a8" font-size="11" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="1.1">PERSISTENT CHALLENGES</text>
            <rect x="52" y="435" width="120" height="25" rx="12" fill="#38282c" stroke="#7a454b"/><text x="112" y="451" text-anchor="middle" fill="#f5d7d7" font-size="10.5" font-family="Inter,Arial,sans-serif">Generalization</text>
            <rect x="181" y="435" width="133" height="25" rx="12" fill="#38282c" stroke="#7a454b"/><text x="247" y="451" text-anchor="middle" fill="#f5d7d7" font-size="10.5" font-family="Inter,Arial,sans-serif">Safety validation</text>
            <rect x="323" y="435" width="124" height="25" rx="12" fill="#38282c" stroke="#7a454b"/><text x="385" y="451" text-anchor="middle" fill="#f5d7d7" font-size="10.5" font-family="Inter,Arial,sans-serif">Interpretability</text>
            <text x="52" y="482" fill="#9eb3c9" font-size="11" font-family="Inter,Arial,sans-serif">Reliable performance in changing, uncertain conditions</text>

            <rect x="484" y="397" width="442" height="102" rx="12" fill="#122c29" stroke="#317c69"/>
            <text x="502" y="420" fill="#7fe0c7" font-size="11" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="1.1">EMERGING RESEARCH DIRECTIONS</text>
            <rect x="502" y="435" width="103" height="25" rx="12" fill="#183c38" stroke="#367b6b"/><text x="553" y="451" text-anchor="middle" fill="#d3f5e9" font-size="10.5" font-family="Inter,Arial,sans-serif">Digital twins</text>
            <rect x="614" y="435" width="82" height="25" rx="12" fill="#183c38" stroke="#367b6b"/><text x="655" y="451" text-anchor="middle" fill="#d3f5e9" font-size="10.5" font-family="Inter,Arial,sans-serif">Edge AI</text>
            <rect x="705" y="435" width="103" height="25" rx="12" fill="#183c38" stroke="#367b6b"/><text x="756" y="451" text-anchor="middle" fill="#d3f5e9" font-size="10.5" font-family="Inter,Arial,sans-serif">Quantum ML</text>
            <rect x="817" y="435" width="91" height="25" rx="12" fill="#183c38" stroke="#367b6b"/><text x="862" y="451" text-anchor="middle" fill="#d3f5e9" font-size="10" font-family="Inter,Arial,sans-serif">Large language models</text>
            <text x="502" y="482" fill="#9fcbbd" font-size="11" font-family="Inter,Arial,sans-serif">Toward scalable, adaptable and human-aware autonomy</text>

            <rect x="34" y="517" width="892" height="31" rx="8" fill="#0d1928" stroke="#344658"/>
            <text x="50" y="537" fill="#c8d7e6" font-size="11.5" font-family="Inter,Arial,sans-serif">Research mapping informs the field’s structure; it does not replace system-level safety testing.</text>
          </svg>