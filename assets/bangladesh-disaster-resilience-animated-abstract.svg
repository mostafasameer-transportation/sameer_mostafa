<svg viewBox="0 0 960 590" role="img" aria-labelledby="bdAbstractTitle bdAbstractDesc" xmlns="http://www.w3.org/2000/svg">
            <title id="bdAbstractTitle">Computational Review of Disaster Resilience Research in Bangladesh</title>
            <desc id="bdAbstractDesc">Animated summary of PRISMA screening of 301 studies, ten-topic LDA modeling, the social-technical divide and an integrated decision-support blueprint.</desc>
            <style>
              .bd-flow{stroke-dasharray:7 8;animation:bdDash 11s linear infinite}
              .bd-pulse{transform-box:fill-box;transform-origin:center;animation:bdPulse 2.8s ease-in-out infinite}
              .bd-pop{animation:bdPop 4.4s ease-in-out infinite}
              @keyframes bdDash{to{stroke-dashoffset:-150}}
              @keyframes bdPulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
              @keyframes bdPop{0%,100%{opacity:.8}50%{opacity:1}}
              @media(prefers-reduced-motion:reduce){.bd-flow,.bd-pulse,.bd-pop{animation:none!important}.bd-traveler{display:none}}
            </style>
            <defs>
              <linearGradient id="bdBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#092b40"/><stop offset="1" stop-color="#121b26"/></linearGradient>
              <linearGradient id="bdSignal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#43a8e8"/><stop offset="1" stop-color="#6dd7b4"/></linearGradient>
            </defs>
            <rect width="960" height="590" rx="18" fill="url(#bdBg)"/>
            <text x="34" y="37" fill="#91d5ff" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="2">ANIMATED RESEARCH VISUAL SUMMARY · 2025</text>
            <text x="34" y="72" fill="#fff" font-size="27" font-family="Inter,Arial,sans-serif" font-weight="800">Disaster Resilience Research in Bangladesh</text>
            <text x="34" y="98" fill="#c9d7e6" font-size="14" font-family="Inter,Arial,sans-serif">A reproducible PRISMA + LDA review of the evidence base, themes and critical gaps</text>
            <rect x="34" y="116" width="892" height="1.5" fill="#344658"/>

            <text x="34" y="140" fill="#8edfd4" font-size="11.5" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="1.4">PRISMA SCREENING · 2014–2024</text>
            <path d="M90 177 H870" stroke="#31516d" stroke-width="2" fill="none"/>
            <path d="M90 177 H870" stroke="url(#bdSignal)" stroke-width="2.5" fill="none" class="bd-flow"/>
            <circle class="bd-traveler" r="5" fill="#fff"><animateMotion dur="7.5s" repeatCount="indefinite" path="M90 177 H870"/></circle>

            <g>
              <rect x="34" y="153" width="202" height="84" rx="11" fill="#142c42" stroke="#3d82b5"/>
              <text x="50" y="178" fill="#8bc8ff" font-size="10.5" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing=".8">RECORDS RETRIEVED</text>
              <text x="50" y="212" fill="#fff" font-size="27" font-family="Inter,Arial,sans-serif" font-weight="800">701</text>
              <text x="112" y="210" fill="#b8ccdf" font-size="11.5" font-family="Inter,Arial,sans-serif">initial results</text>
            </g>
            <g>
              <rect x="250" y="153" width="202" height="84" rx="11" fill="#142c42" stroke="#3d82b5"/>
              <text x="266" y="178" fill="#8bc8ff" font-size="10.5" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing=".8">AFTER DEDUPLICATION</text>
              <text x="266" y="212" fill="#fff" font-size="27" font-family="Inter,Arial,sans-serif" font-weight="800">652</text>
              <text x="328" y="210" fill="#b8ccdf" font-size="11.5" font-family="Inter,Arial,sans-serif">unique records</text>
            </g>
            <g>
              <rect x="466" y="153" width="202" height="84" rx="11" fill="#142c42" stroke="#3d82b5"/>
              <text x="482" y="178" fill="#8bc8ff" font-size="10.5" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing=".8">FULL-TEXT REVIEW</text>
              <text x="482" y="212" fill="#fff" font-size="27" font-family="Inter,Arial,sans-serif" font-weight="800">383</text>
              <text x="544" y="210" fill="#b8ccdf" font-size="11.5" font-family="Inter,Arial,sans-serif">after screening</text>
            </g>
            <g>
              <rect x="682" y="153" width="244" height="84" rx="11" fill="#153228" stroke="#41b67c"/>
              <text x="698" y="178" fill="#7fe0af" font-size="10.5" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing=".8">FINAL CORPUS</text>
              <text x="698" y="212" fill="#fff" font-size="27" font-family="Inter,Arial,sans-serif" font-weight="800">301</text>
              <text x="760" y="210" fill="#c2dfd1" font-size="11.5" font-family="Inter,Arial,sans-serif">peer-reviewed studies</text>
              <circle cx="900" cy="169" r="5" fill="#7fe0af" class="bd-pulse"/>
            </g>

            <text x="34" y="264" fill="#d9e7f5" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="1.4">COMPUTATIONAL MAPPING · 10-TOPIC LDA MODEL</text>
            <rect x="34" y="278" width="426" height="125" rx="12" fill="#14263a" stroke="#3a5976"/>
            <text x="52" y="303" fill="#8bc8ff" font-size="11" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="1">DOMINANT RESEARCH AGENDAS</text>
            <rect x="52" y="318" width="387" height="30" rx="8" fill="#193a52" stroke="#2e678a"/>
            <circle cx="67" cy="333" r="5" fill="#6fcaff" class="bd-pulse"/>
            <text x="81" y="337" fill="#f1f7fc" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="700">Community adaptation &amp; livelihood resilience</text>
            <rect x="52" y="357" width="387" height="30" rx="8" fill="#193a52" stroke="#2e678a"/>
            <circle cx="67" cy="372" r="5" fill="#6fcaff" class="bd-pulse" style="animation-delay:.5s"/>
            <text x="81" y="376" fill="#f1f7fc" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="700">Disaster risk reduction policy &amp; institutions</text>

            <rect x="478" y="278" width="448" height="125" rx="12" fill="#30251f" stroke="#9c6736"/>
            <text x="496" y="303" fill="#ffc36c" font-size="11" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="1">STRUCTURAL DIVIDE &amp; UNDEREXPLORED GAPS</text>
            <text x="496" y="327" fill="#fff" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="700">Social–technical separation</text>
            <text x="496" y="345" fill="#e7d8c8" font-size="11.5" font-family="Inter,Arial,sans-serif">Community-focused qualitative research often remains</text>
            <text x="496" y="361" fill="#e7d8c8" font-size="11.5" font-family="Inter,Arial,sans-serif">separate from quantitative hazard and infrastructure models.</text>
            <rect x="496" y="372" width="185" height="20" rx="10" fill="#493326" stroke="#9c6736"/><text x="588" y="385" text-anchor="middle" fill="#ffddb1" font-size="10" font-family="Inter,Arial,sans-serif">Supply-chain resilience</text>
            <rect x="688" y="372" width="220" height="20" rx="10" fill="#493326" stroke="#9c6736"/><text x="798" y="385" text-anchor="middle" fill="#ffddb1" font-size="10" font-family="Inter,Arial,sans-serif">Salinity–health linkages</text>

            <text x="34" y="430" fill="#7fe0c7" font-size="11.5" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="1.4">PROPOSED INTEGRATION BLUEPRINT</text>
            <g>
              <rect x="34" y="443" width="270" height="69" rx="10" fill="#12372f" stroke="#3d9d7d"/>
              <text x="50" y="464" fill="#7fe0af" font-size="10" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing=".8">LAYER 1</text>
              <text x="50" y="486" fill="#fff" font-size="13" font-family="Inter,Arial,sans-serif" font-weight="700">Participatory GIS indicators</text>
              <text x="50" y="502" fill="#b7ddce" font-size="10.5" font-family="Inter,Arial,sans-serif">Community and policy context</text>
              <rect x="326" y="443" width="284" height="69" rx="10" fill="#12372f" stroke="#3d9d7d"/>
              <text x="342" y="464" fill="#7fe0af" font-size="10" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing=".8">LAYER 2</text>
              <text x="342" y="486" fill="#fff" font-size="13" font-family="Inter,Arial,sans-serif" font-weight="700">Hazard &amp; lifeline rasters</text>
              <text x="342" y="502" fill="#b7ddce" font-size="10.5" font-family="Inter,Arial,sans-serif">Exposure and critical infrastructure</text>
              <rect x="632" y="443" width="294" height="69" rx="10" fill="#12372f" stroke="#3d9d7d"/>
              <text x="648" y="464" fill="#7fe0af" font-size="10" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing=".8">LAYER 3</text>
              <text x="648" y="486" fill="#fff" font-size="13" font-family="Inter,Arial,sans-serif" font-weight="700">Bayesian-network inference</text>
              <text x="648" y="502" fill="#b7ddce" font-size="10.5" font-family="Inter,Arial,sans-serif">Uncertainty-aware decision support</text>
              <path d="M304 477 H326 M610 477 H632" stroke="#6dd7b4" stroke-width="2.5" fill="none" class="bd-flow"/>
              <circle cx="315" cy="477" r="4" fill="#d9fff1" class="bd-pulse"/>
              <circle cx="621" cy="477" r="4" fill="#d9fff1" class="bd-pulse" style="animation-delay:.7s"/>
            </g>

            <rect x="34" y="528" width="892" height="36" rx="8" fill="#0d1928" stroke="#344658"/>
            <text x="50" y="550" fill="#c8d7e6" font-size="11.5" font-family="Inter,Arial,sans-serif">Practical aim: connect community, hazard and infrastructure evidence for transparent, multi-hazard resilience planning.</text>
          </svg>